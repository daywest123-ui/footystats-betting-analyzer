name: Telegram Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/telegram_notify.py'

jobs:
  telegram-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo 'TELEGRAM_BOT_TOKEN secret missing'; exit 1; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo 'TELEGRAM_CHAT_ID secret missing'; exit 1; fi
          python app/telegram_notify.py
