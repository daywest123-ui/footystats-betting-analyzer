name: 20-Minute Coupon Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coupon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Smoke tests
        working-directory: app
        run: python -m unittest discover -p 'test_*.py'
      - name: Run 20-minute engine
        run: python -m app.run_20min_coupon
      - name: Summary
        if: always()
        run: |
          if [ -f reports/latest_20min_coupon.md ]; then
            cat reports/latest_20min_coupon.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rapor üretilemedi." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20min-football-coupon
          path: |
            reports/latest_20min_coupon.json
            reports/latest_20min_coupon.md
          if-no-files-found: ignore
