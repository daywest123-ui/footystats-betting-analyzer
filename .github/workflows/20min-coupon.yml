name: 20-Minute Coupon Scan\n\non:\n  workflow_dispatch:\n  push:\n    paths:\n      - "app/**"\n      - "requirements*.txt"\n      - ".github/workflows/20min-coupon.yml"\n\npermissions:\n  contents: write\n\njobs:\n  coupon:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    env:\n      PYTHONPATH: ${{ github.workspace }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install core dependencies\n        run: pip install -r requirements.txt\n      - name: Install OddsHarvester\n        run: pip install -r requirements-local.txt\n      - name: Install Chromium\n        run: python -m playwright install chromium\n      - name: Compile check\n        run: python -m compileall -q app\n      - name: Unit smoke tests\n        run: python -m unittest discover -s app -p 'test_*.py'\n      - name: OddsHarvester CLI smoke test\n        run: python -m oddsharvester --help\n      - name: Run 20-minute engine\n        run: python -m app.run_20min_coupon\n      - name: Summary\n        if: always()\n        run: |\n          if [ -f reports/latest_20min_coupon.md ]; then\n            cat reports/latest_20min_coupon.md >> "$GITHUB_STEP_SUMMARY"\n          else\n            echo "Rapor üretilemedi." >> "$GITHUB_STEP_SUMMARY"\n          fi\n      - name: Upload report\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: 20min-football-coupon\n          path: |\n            reports/latest_20min_coupon.json\n            reports/latest_20min_coupon.md\n          if-no-files-found: ignore\n