name: Daily Football Value Scanner

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours; GitHub cron uses UTC.
    - cron: '15 */6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PYTHONPATH: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: app
        run: python -m unittest discover -p 'test_*.py'
      - name: Run automatic fixture scan
        run: python -m app.auto_match_selector
      - name: Publish analysis summary
        if: always()
        run: |
          echo "## ⚽ Ultimate Betting Analyzer — Son Tarama" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/latest_auto_analysis.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("reports/latest_auto_analysis.json", encoding="utf-8"))
          rows=[]
          for item in p.get("top_matches",[])[:5]:
              eligible=[m for m in item.get("market_analysis",[]) if m.get("decision")=="ANALYZE"]
              if eligible:
                  m=eligible[0]
                  rows.append((item.get("home"),item.get("away"),m))
          print(f"**Taranan maç:** {p.get('fixtures_scanned',0)} | **Uygun aday:** {len(rows)}")
          print("")
          if rows:
              print("| # | Maç | Market | Oran | Model | Value | Güven |")
              print("|---|---|---|---:|---:|---:|---:|")
              for i,(h,a,m) in enumerate(rows,1):
                  print(f"| {i} | {h} vs {a} | {m['market']} | {m['odds']:.2f} | %{m['model_probability_pct']} | %{m['value_edge_pct']:+.2f} | {m['confidence_10']}/10 |")
          else:
              print("### NO BET")
              print("Kriterleri geçen market bulunamadı.")
          PY
          else
            echo "### Rapor üretilemedi" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save daily report
        uses: actions/upload-artifact@v4
        with:
          name: daily-football-analysis
          path: reports/latest_auto_analysis.json
          if-no-files-found: ignore
