name: Football Analyzer Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s app -p 'test_*.py'

      - name: Public web smoke test
        run: python - <<'PY'
from open_web_intelligence import google_news_rss
items = google_news_rss('football match prediction', 'en', 'US', 3)
print(f'Public RSS collection successful: {len(items)} items')
PY

      - name: Optional Football Data API test
        if: ${{ secrets.FOOTBALL_DATA_API_KEY != '' }}
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python app/football_data_client.py
