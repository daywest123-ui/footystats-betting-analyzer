name: Football Analyzer Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: app
        run: python -m unittest discover -p 'test_*.py'

      - name: Public web smoke test
        run: |
          python - <<'PY'
          from app.open_web_intelligence import google_news_rss
          items = google_news_rss('football match prediction', 'en', 'US', 3)
          print(f'Public RSS collection successful: {len(items)} items')
          PY

      - name: Send email connection test
        if: ${{ secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' }}
        env:
          SMTP_HOST: smtp-mail.outlook.com
          SMTP_PORT: '587'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: day_west_123@hotmail.com
        run: python app/email_report.py
