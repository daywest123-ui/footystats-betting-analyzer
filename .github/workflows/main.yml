name: Multi-Sport Analyzer

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PYTHONPATH: ${{ github.workspace }}/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: app
        run: python -m unittest discover -p 'test_*.py'

      - name: API-Sports configuration check
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo "API-Sports key configured: yes"
          else
            echo "API-Sports key configured: no"
            exit 1
          fi

      - name: Run multi-sport scanner and build coupons
        run: python -m app.multi_sport_coupon

      - name: Run legacy football analyzer
        continue-on-error: true
        run: python -m app.auto_match_selector

      - name: Save multi-sport coupon
        uses: actions/upload-artifact@v4
        with:
          name: multi-sport-coupon
          path: reports/multi_sport_coupon.json

      - name: Save legacy analysis if present
        uses: actions/upload-artifact@v4
        with:
          name: latest-auto-analysis
          path: reports/latest_auto_analysis.json
          if-no-files-found: ignore
