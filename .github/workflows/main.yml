name: Open Data Football Analyzer

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: app
        run: python -m unittest discover -p 'test_*.py'

      - name: Run keyless open-data football analyzer
        run: python -m app.auto_match_selector

      - name: Show result in GitHub Actions
        if: always()
        run: |
          echo "## 📊 Çoklu Spor Analiz Sonucu" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/multi_sport_coupon.json ]; then
            cat reports/multi_sport_coupon.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '---' >> "$GITHUB_STEP_SUMMARY"
            echo "### Ham çıktı" >> "$GITHUB_STEP_SUMMARY"
            cat reports/multi_sport_coupon.json
          else
            echo "Rapor oluşturulamadı." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save multi-sport coupon
        uses: actions/upload-artifact@v4
        with:
          name: multi-sport-coupon
          path: reports/multi_sport_coupon.json

      - name: Save legacy analysis if present
        uses: actions/upload-artifact@v4
        with:
          name: latest-auto-analysis
          path: reports/latest_auto_analysis.json
          if-no-files-found: ignore
