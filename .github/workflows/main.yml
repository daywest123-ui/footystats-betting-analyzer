name: Football Analyzer

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: app
        run: python -m unittest discover -p 'test_*.py'

      - name: Public web smoke test
        run: |
          python - <<'PY'
          from app.open_web_intelligence import google_news_rss
          items = google_news_rss('football match prediction', 'en', 'US', 3)
          print(f'Public RSS collection successful: {len(items)} items')
          PY

      - name: Automatic match discovery and analysis
        run: python app/auto_match_selector.py

      - name: Save latest analysis report
        uses: actions/upload-artifact@v4
        with:
          name: latest-auto-analysis
          path: reports/latest_auto_analysis.json
