<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HT/FT Value Hunter X</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:16px;background:#0d1117;color:#e6edf3}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin:12px 0}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px}input{background:#0d1117;color:#fff;border:1px solid #30363d}button{border:0;background:#238636;color:#fff;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #30363d;text-align:left}</style></head><body><div class="card"><h1>⚡ HT/FT VALUE HUNTER X</h1><input id="h" placeholder="Ev sahibi"><input id="a" placeholder="Deplasman"><input id="hg" type="number" step=".01" value="1.8" placeholder="Ev beklenen gol"><input id="ag" type="number" step=".01" value="1.1" placeholder="Dep beklenen gol"><button onclick="run()">ANALİZ ET</button></div><div id="o"></div><script>function f(k,l){let x=1;for(let i=2;i<=k;i++)x*=i;return Math.exp(-l)*l**k/x}function run(){let hg=+document.getElementById('hg').value,ag=+document.getElementById('ag').value,o={};for(let x of ['1','X','2'])for(let y of ['1','X','2'])o[x+'/'+y]=0;for(let h=0;h<8;h++)for(let a=0;a<8;a++)for(let u=0;u<8;u++)for(let v=0;v<8;v++){let p=f(h,hg*.44)*f(a,ag*.44)*f(u,hg*.56)*f(v,ag*.56),ht=h>a?'1':h==a?'X':'2',ft=h+u>a+v?'1':h+u==a+v?'X':'2';o[ht+'/'+ft]+=p}let s=Object.values(o).reduce((a,b)=>a+b,0),r=Object.entries(o).map(([k,v])=>[k,v/s]).sort((a,b)=>b[1]-a[1]);document.getElementById('o').innerHTML='<div class="card"><h3>'+document.getElementById('h').value+' — '+document.getElementById('a').value+'</h3><table><tr><th>HT/FT</th><th>Model</th><th>Fair</th></tr>'+r.map(x=>'<tr><td>'+x[0]+'</td><td>'+((x[1])*100).toFixed(2)+'%</td><td>'+ (1/x[1]).toFixed(2)+'</td></tr>').join('')+'</table></div>'}</script></body></html>
